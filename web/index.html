<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Chestream · Plataforma de Streaming</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body class="cargando">

  <!-- Pantalla de carga -->
  <div id="carga" class="splash" role="status" aria-live="polite">
    <div class="splash-halo" aria-hidden="true"></div>
    <div class="splash-centro">
      <img class="splash-logo" src="logo.svg" alt="">
      <div class="wordmark wordmark-grande" aria-label="Chestream">CHES<b>TREAM</b></div>
      <img class="splash-ches" src="img/mascota_3d.svg" alt="">
      <div class="splash-estado">
        <span class="splash-barra" aria-hidden="true"><i></i></span>
        <span id="carga-texto">Cargando catálogo…</span>
      </div>
    </div>
  </div>

  <!-- Barra superior -->
  <header class="barra">
    <a class="marca" id="ir-inicio" href="#" aria-label="Ir al inicio">
      <img src="logo.svg" alt="">
      <span class="wordmark">CHES<b>TREAM</b></span>
    </a>

    <form id="form-busqueda" class="capsula" role="search" autocomplete="off">
      <label class="visually-hidden" for="tipo-busqueda">Buscar en</label>
      <select id="tipo-busqueda">
        <option value="texto">Título o sinopsis</option>
        <option value="director">Director</option>
        <option value="genre">Género</option>
        <option value="cast">Casting</option>
        <option value="origin">Origen</option>
      </select>
      <label class="visually-hidden" for="campo-busqueda">Búsqueda</label>
      <input id="campo-busqueda" type="text" spellcheck="false"
             placeholder="Busca una palabra, frase o parte de palabra">
      <button type="button" class="limpiar oculto" id="btn-limpiar" aria-label="Limpiar búsqueda">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <kbd class="atajo" title="Atajo: / o Ctrl+K">/</kbd>
      <button type="submit" class="btn-buscar">Buscar</button>
    </form>

    <nav class="accesos" aria-label="Tus listas">
      <button class="acceso" data-lista="likes" aria-label="Ver tus Likes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-9.2-9A5 5 0 0 1 12 6a5 5 0 0 1 9.2 5c-2.2 4.6-9.2 9-9.2 9z"/></svg>
        <span>Likes</span><span class="contador" id="contador-likes">0</span>
      </button>
      <button class="acceso" data-lista="vermastarde" aria-label="Ver tu lista Ver más tarde">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
        <span>Ver más tarde</span><span class="contador" id="contador-tarde">0</span>
      </button>
      <span class="catalogo" id="info-carga" title="Películas en el catálogo"></span>
    </nav>
  </header>

  <main>
    <!-- Inicio -->
    <section id="vista-inicio">
      <div class="hero">
        <img class="hero-ches" src="img/mascota_canchita.svg" alt="Ches, la mascota de Chestream">
        <div class="hero-texto">
          <h1>¿Qué vemos hoy?</h1>
          <p>Más de 34 mil películas. Busca por una palabra, una frase o solo una parte de ella.</p>
          <div class="sugerencias" id="sugerencias"></div>
        </div>
      </div>

      <section class="fila fila-recomendada" aria-labelledby="t-recom">
        <div class="fila-cabecera">
          <h2 id="t-recom">Similares a tus Likes</h2>
          <span class="fila-nota" id="nota-recom"></span>
        </div>
        <div class="carril" id="fila-recomendadas"></div>
      </section>

      <section class="fila" aria-labelledby="t-tarde">
        <div class="fila-cabecera">
          <h2 id="t-tarde">Ver más tarde</h2>
          <button class="ver-todos" data-lista="vermastarde">Ver todos</button>
        </div>
        <div class="carril" id="fila-ver-mas-tarde"></div>
      </section>

      <section class="fila" aria-labelledby="t-likes">
        <div class="fila-cabecera">
          <h2 id="t-likes">Tus Likes</h2>
          <button class="ver-todos" data-lista="likes">Ver todos</button>
        </div>
        <div class="carril" id="fila-likes"></div>
      </section>
    </section>

    <!-- Resultados / listas completas -->
    <section id="vista-resultados" class="oculto" aria-live="polite">
      <div class="cabecera-resultados">
        <div>
          <h2 id="titulo-resultados">Resultados</h2>
          <p class="conteo" id="conteo-resultados"></p>
        </div>
        <button class="btn-fantasma" id="volver-inicio">Volver al inicio</button>
      </div>

      <div class="grilla" id="grilla-resultados"></div>

      <nav class="paginacion" aria-label="Páginas de resultados">
        <button class="pag-btn" id="btn-anterior" aria-label="Cinco anteriores (flecha izquierda)">‹ Anteriores</button>
        <span id="texto-pagina"></span>
        <button class="pag-btn pag-sig" id="btn-siguiente" aria-label="Cinco siguientes (flecha derecha)">Siguientes ›</button>
      </nav>
    </section>
  </main>

  <!-- Detalle de una película -->
  <div id="modal" class="modal oculto" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal-fondo" data-cerrar></div>
    <article class="modal-caja">
      <button class="cerrar" data-cerrar aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="modal-izq">
        <div class="modal-poster" id="modal-poster"></div>
        <div class="modal-acciones">
          <button class="btn-accion" id="btn-like" aria-pressed="false"></button>
          <button class="btn-accion" id="btn-mas-tarde" aria-pressed="false"></button>
        </div>
      </div>
      <div class="modal-der">
        <h2 id="modal-titulo"></h2>
        <div class="modal-meta" id="modal-meta"></div>
        <div class="modal-sinopsis" id="modal-sinopsis"></div>
        <div class="creditos" id="modal-creditos"></div>
        <a class="enlace-wiki" id="modal-wiki" target="_blank" rel="noopener">Leer en Wikipedia</a>
      </div>
    </article>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="posters.js"></script>
  <script src="app.js"></script>
</body>
</html>
